# --- Simulation Settings ---
simulation:
  city_name: "NYC"
  num_steps: 50
  num_workers: 10
  seed: 1001
  alpha: 2.0
  d_max_km: 0.675

# --- LLM Settings ---
llm_generation:
  model_name: "gemini-2.5-pro"
  platform: "google"
  temperature: 0.0

situational_context:
  file: null

# --- File Paths ---
paths:
  # Input Data
  agent_profiles: "agent_initialization/agent_profiles_NYC.json"
  cbg_profiles: "agent_initialization/cbg_profiles_NYC.json"
  cbg_geo_data: "data/Census/2019/metadata/cbg_geographic_data.csv"
  poi_data_pattern: "data/core_poi/NYC_core_poi_dummy.csv"
  ranges: "data/Census/2019/data/ranges.json"
  weekly_patterns: "data/Weekly_patterns/Week-2019-06-10/2019-06-10-weekly-patterns_NYC_dummy.csv"
  home_panel_summary: "data/Weekly_home_panel_summary/2019-06-10-home-panel-summary_NYC_dummy.csv"
  cbg_boundaries: "data/population/NYC/Basic_Geographic_Statistics_CBG_NYC.csv"

  # Behavioral Inference Output
  policy_functions: "TIMA_inference_output/NYC/TIMA_behavior_priors.json"

  # Simulation Output Directory
  output_dir: "TIMA_simulation_output"
  output_filename: "agent_movements_llm.jsonl"

evaluation:
  year: 2019
  sampling_threshold: 0.0
  boundary_cbg_column: "CBG Code"
  hotspot_output: null
